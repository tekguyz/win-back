<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win-Back: logo options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f6f4ef; --surface:#fff; --line:#dad5ca; --ink:#1b1e2c; --muted:#5b6070; --brand:#2f3f8f; --coral:#e8734f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 "Public Sans", system-ui, sans-serif; padding:32px 16px 64px; }
  h1, h2 { font-family:"Fraunces", serif; letter-spacing:-0.01em; }
  main { max-width:1100px; margin:0 auto; }
  .opt { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:24px; margin-top:24px; }
  .row { display:flex; flex-wrap:wrap; gap:20px; align-items:center; margin-top:16px; }
  .logo { display:flex; align-items:center; gap:10px; padding:18px 22px; border-radius:14px; font:600 24px "Fraunces", serif; }
  .light { background:var(--paper); }
  .dark { background:var(--ink); color:var(--paper); }
  .tab { display:flex; align-items:center; gap:8px; background:#dee1e6; border-radius:10px 10px 0 0; padding:8px 14px; font-size:13px; width:230px; }
  .card { width:320px; max-width:100%; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; font-size:13px; }
  .card .img { height:160px; background:var(--paper); display:flex; flex-direction:column; justify-content:center; padding:18px; gap:8px; }
  .card .img b { font:600 22px/1.05 "Fraunces", serif; }
  .card .meta { padding:10px 12px; background:#f0f2f5; }
  .label { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Win-Back: logo options</h1>
  <p class="label">Pick one and write it in DESIGN.md. The favicon, home-screen icon and link preview are drawn from it. Option A is in the app now as a stand-in only; nothing is picked yet.</p>
  <div id="opts"></div>
</main>
<template id="t">
  <section class="opt">
    <h2 class="name"></h2>
    <p class="why label"></p>
    <div class="row">
      <div class="logo light"><span class="m" data-s="34"></span>Win-Back</div>
      <div class="logo dark"><span class="m" data-s="34" data-dark></span>Win-Back</div>
    </div>
    <div class="row">
      <div><div class="tab"><span class="m" data-s="16"></span>Win-Back · Bring back the…</div><p class="label">Favicon, 16 px</p></div>
      <div><div class="tab"><span class="m" data-s="32"></span>Win-Back</div><p class="label">32 px</p></div>
      <div><span class="m" data-s="72"></span><p class="label">Home-screen icon</p></div>
      <div class="card"><div class="img"><span class="m" data-s="30"></span><b>Bring back the customers who stopped calling.</b></div><div class="meta"><strong>Win-Back · Bring back the customers who stopped calling</strong><br>Finds past customers who stopped coming back…</div></div>
    </div>
  </section>
</template>
<script>
  const marks = {
    A: { name: "A · Comes back", why: "An arrow that goes out and turns back home. Indigo square, coral arrowhead. Reads well at 16 px.",
      svg: () => `<rect width="32" height="32" rx="8" fill="#2f3f8f"/><path d="M22 10.5H13a5.5 5.5 0 0 0 0 11h8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M18 18l3.5 3.5L18 25" fill="none" stroke="#e8734f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>` },
    B: { name: "B · Welcome back", why: "A house with a message bubble in the door: a note to a past customer's home. Warmer, a little busier when tiny.",
      svg: () => `<rect width="32" height="32" rx="16" fill="#2f3f8f"/><path d="M8 15.5L16 9l8 6.5V24H8z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M13 16.5h6a1 1 0 0 1 1 1v2.5a1 1 0 0 1-1 1h-3l-2 1.6V21h-1a1 1 0 0 1-1-1v-2.5a1 1 0 0 1 1-1z" fill="#e8734f"/>` },
    C: { name: "C · Due again", why: "A calendar page with a turn-around arrow: the yearly visit that came back round. Literal and plain.",
      svg: (dark) => `<rect width="32" height="32" rx="8" fill="${dark ? '#e8734f' : '#1b1e2c'}"/><rect x="8" y="9" width="16" height="15" rx="2.5" fill="#f6f4ef"/><path d="M8 13.5h16" stroke="#2f3f8f" stroke-width="2"/><path d="M12 7.5v3M20 7.5v3" stroke="#f6f4ef" stroke-width="2" stroke-linecap="round"/><path d="M19.5 18.5a3.5 3.5 0 1 1-1-2.5" fill="none" stroke="#2f3f8f" stroke-width="1.8" stroke-linecap="round"/><path d="M19 14.8v1.8h-1.8" fill="none" stroke="#2f3f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>` },
  };
  const host = document.getElementById("opts");
  for (const k of Object.keys(marks)) {
    const node = document.getElementById("t").content.cloneNode(true);
    node.querySelector(".name").textContent = marks[k].name;
    node.querySelector(".why").textContent = marks[k].why;
    node.querySelectorAll(".m").forEach((el) => {
      const s = el.dataset.s;
      el.innerHTML = `<svg width="${s}" height="${s}" viewBox="0 0 32 32" style="display:block">${marks[k].svg(el.hasAttribute("data-dark"))}</svg>`;
    });
    host.appendChild(node);
  }
</script>
</body>
</html>
